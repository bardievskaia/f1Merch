<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Store</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Logo" />
    </div>
    <nav>
        <ul>
          <li><a href="#">Tienda</a></li>
          <li><a href="#">Tickets</a></li>
          <li><a href="#">Carreras</a></li>
          <li><a href="#">Blog</a></li>
        </ul>
      </nav>
    <div class="cart-button-container">
      <button id="cart-button"> Carrito (<span id="cart-count">0</span>)</button>
    </div>
  </header>
  
  <main id="product-list"></main>

  <div id="cart-popup" class="cart-popup">
    <div class="cart-content">
      <span class="close-btn" id="close-cart">&times;</span>
      <h2>Carrito</h2>
      <ul id="cart-items"></ul>
      <p>Total: <span id="cart-total">$0</span></p>
      <button id="checkout">Comprar</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 F1 Online Store. Light out and away we go. </p>
  </footer>
</body>
</html>
